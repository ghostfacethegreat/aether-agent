<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">AETHER</title>
  <desc id="desc">A local-first AI agent with inspectable memory, specialist workflows, and approval-gated tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#101b35"/>
      <stop offset="1" stop-color="#1b1740"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.52" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".34"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#94a3b8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1400" height="420" rx="30" fill="url(#bg)"/>
  <rect width="1400" height="420" rx="30" fill="url(#grid)"/>
  <circle cx="1120" cy="170" r="310" fill="url(#glow)"/>
  <g fill="#c4b5fd" opacity=".7">
    <circle cx="1010" cy="66" r="2"/><circle cx="1190" cy="92" r="2"/>
    <circle cx="1280" cy="245" r="2"/><circle cx="1090" cy="334" r="1.7"/>
    <circle cx="930" cy="286" r="1.5"/><circle cx="1320" cy="125" r="1.5"/>
    <circle cx="870" cy="102" r="1.5"/><circle cx="1180" cy="370" r="1.5"/>
  </g>
  <g transform="translate(150 210)">
    <circle r="126" fill="#0b172b" stroke="url(#accent)" stroke-width="3" opacity=".98"/>
    <circle r="104" fill="none" stroke="#93c5fd" stroke-opacity=".2" stroke-width="1.5" stroke-dasharray="4 10"/>
    <ellipse rx="152" ry="58" transform="rotate(-28)" fill="none" stroke="url(#accent)" stroke-opacity=".48" stroke-width="2"/>
    <path d="M-58 48L0-73 58 48M-39 9H39" fill="none" stroke="url(#accent)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
    <circle cx="104" cy="-58" r="7" fill="#5eead4"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="360" y="178" fill="#f8fafc" font-size="108" font-weight="800" letter-spacing="8">AETHER</text>
    <text x="368" y="235" fill="#cbd5e1" font-size="28" font-weight="500" letter-spacing="2">LOCAL-FIRST AI AGENT</text>
    <text x="368" y="282" fill="#94a3b8" font-size="21">Your models. Your memory. Your approval.</text>
    <g font-size="15" font-weight="650" letter-spacing="1">
      <rect x="365" y="318" width="174" height="42" rx="21" fill="#0c2634" stroke="#5eead4" stroke-opacity=".45"/>
      <text x="452" y="345" text-anchor="middle" fill="#99f6e4">PROVIDER-AGNOSTIC</text>
      <rect x="555" y="318" width="154" height="42" rx="21" fill="#14233d" stroke="#60a5fa" stroke-opacity=".5"/>
      <text x="632" y="345" text-anchor="middle" fill="#bfdbfe">INSPECTABLE</text>
      <rect x="725" y="318" width="174" height="42" rx="21" fill="#211d42" stroke="#a78bfa" stroke-opacity=".5"/>
      <text x="812" y="345" text-anchor="middle" fill="#ddd6fe">APPROVAL-GATED</text>
    </g>
  </g>
  <path d="M1010 0C1080 105 1050 255 1400 315" fill="none" stroke="#60a5fa" stroke-opacity=".14" stroke-width="2"/>
  <path d="M930 0C1000 135 1010 290 1400 385" fill="none" stroke="#a78bfa" stroke-opacity=".12" stroke-width="2"/>
</svg>
