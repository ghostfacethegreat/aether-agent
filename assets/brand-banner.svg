  <ellipse cx="0" cy="0" rx="9" ry="14" fill="#09090b"/>
  <circle cx="3" cy="-5" r="3" fill="#f7e9d0"/>
</g>
<g fill="#d8b886" opacity=".75" font-family="Georgia,serif" font-size="15">
  <text x="78" y="92">✦</text><text x="564" y="72">⌬</text><text x="680" y="282">⟡</text>
  <text x="1340" y="94">✧</text><text x="790" y="126">◌</text><text x="872" y="290">✳</text>
