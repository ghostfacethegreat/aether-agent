<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
<title id="title">Ghostface — independent software</title>
<desc id="desc">A deep crimson and ink-black technical banner with an ivory star-and-eye emblem, fine gold geometry, and editorial typography.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#12090b"/>
    <stop offset=".46" stop-color="#3b090e"/>
    <stop offset="1" stop-color="#10080a"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f4dfb7"/>
    <stop offset=".55" stop-color="#b58a56"/>
    <stop offset="1" stop-color="#6d4930"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#8d2630" stop-opacity=".42"/>
    <stop offset="1" stop-color="#8d2630" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#d4a76a" stroke-opacity=".10" stroke-width="1"/>
    <circle cx="0" cy="0" r="1.5" fill="#e5c18d" fill-opacity=".25"/>
  </pattern>
</defs>
<rect width="1440" height="360" fill="url(#bg)"/>
<rect width="1440" height="360" fill="url(#grid)"/>
<ellipse cx="1130" cy="180" rx="390" ry="260" fill="url(#glow)"/>
