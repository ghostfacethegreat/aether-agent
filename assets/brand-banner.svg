  <circle cx="1130" cy="180" r="174" stroke-dasharray="2 9"/>
  <circle cx="1130" cy="180" r="206" stroke-opacity=".28"/>
  <path d="M920 180H1340M1130 -24V384M980 30L1280 330M1280 30L980 330" stroke-width="1"/>
  <path d="M30 70H520M30 290H650M650 0V360" stroke-opacity=".22"/>
  <path d="M80 52l12 12-12 12-12-12zM710 48l8 8-8 8-8-8zM1380 276l10 10-10 10-10-10z" />
</g>
<g transform="translate(1130 180)">
  <path d="M0-112L25-34L106-34L40 14L65 94L0 46L-65 94L-40 14L-106-34L-25-34Z" fill="#ead9bf" fill-opacity=".90" stroke="#9d7951" stroke-width="4"/>
