[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-agent"
version = "0.1.0"
description = "Local-first, provider-agnostic AI agent with editable memory, skills, tools, and subagents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Aether contributors" }]
keywords = ["ai-agent", "local-first", "llm", "cli", "openai-compatible"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
aether = "aether.cli.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["aether*", "benchmarks*"]

[tool.setuptools.package-data]
"aether.skills" = ["builtin/*/SKILL.md"]
