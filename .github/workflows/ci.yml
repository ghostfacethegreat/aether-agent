name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Run project checks
        run: bash scripts/check.sh

      - name: Test installer and uninstaller
        run: bash scripts/test_install.sh

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install built wheel in a clean environment
        shell: bash
        run: |
          python -m venv .venv-release-check
          source .venv-release-check/bin/activate
          python -m pip install --no-deps dist/*.whl
          aether version
          export AETHER_HOME="$(mktemp -d)"
          aether --provider mock run "Say hello"
